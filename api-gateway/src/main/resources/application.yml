server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: student-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/students/**

        - id: tutoring-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/questions/**

        - id: analytics-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/analytics/**

        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/subscriptions/**, /api/payments/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
